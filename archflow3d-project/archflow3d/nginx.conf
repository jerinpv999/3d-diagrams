server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/plain text/css text/markdown application/javascript application/json;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    # The app shell: always revalidate so updates show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # Pinned library versions never change.
    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Docs fetched by "Download project". An empty types{} here (not at server
    # level) keeps nginx's normal MIME table for every other file.
    location ~* \.md$ {
        types { }
        default_type text/markdown;
    }

    # Files without an extension in the project (e.g. Dockerfile).
    location = /Dockerfile {
        types { }
        default_type text/plain;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
