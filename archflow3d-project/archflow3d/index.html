<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ArchFlow 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: workbench — block palette | live 3D stage | inspector + flows + hop log. Single dark "control room" world by choice. */
:root{
  --ink:#0d1420;        /* page ground */
  --panel:#131c2b;      /* side panels */
  --raise:#1a2537;      /* inputs, hover */
  --line:#26344b;       /* hairlines */
  --text:#dbe4f0;
  --muted:#8395ad;
  --req:#ffb547;        /* request packets */
  --res:#4fd8ff;        /* response packets */
  --evt:#c58bff;        /* one-way event packets */
  --str:#7cf29a;        /* stream packets */
  --danger:#ff6b6b;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:13.5px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--res);outline-offset:2px}
#root{height:100%}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em}
.brand b span{color:var(--req)}
.title-in{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;font-family:var(--f-display);font-size:17px;font-weight:500;color:var(--text);min-width:0;width:min(280px,46vw)}
.title-in:hover,.title-in:focus{border-color:var(--line);background:var(--raise)}
.top .spacer{flex:1}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3a4c69;background:#202d42}
.btn.primary{background:var(--req);border-color:var(--req);color:#1b1306}
.btn.primary:hover{background:#ffc46b}
.btn.ghost{background:transparent}
.btn.on{border-color:var(--res);color:var(--res);background:rgba(79,216,255,.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--danger)}
select.btn{padding-right:8px}

/* main */
.main{display:grid;grid-template-columns:262px minmax(0,1fr) 316px;min-height:0}
.pane{background:var(--panel);overflow:auto;min-height:0}
.pane.left{border-right:1px solid var(--line)}
.pane.right{border-left:1px solid var(--line)}
.sec{padding:14px 14px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.search{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
details.cat{border-bottom:1px solid var(--line)}
details.cat summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.03em}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
details.cat summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.cat[open] summary::before{transform:rotate(45deg)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 12px}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
.item:hover{border-color:var(--c);background:#1f2b3f}
.item .row{display:flex;align-items:center;gap:6px;width:100%;min-width:0}
.item .sw{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.item .nm{font-size:12.5px;font-weight:500;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pv{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.04em}

/* stage */
.stage{position:relative;min-width:0;min-height:0;background:#0e1522}
.canvas-host{position:absolute;inset:0}
.canvas-host canvas{display:block;width:100%;height:100%;touch-action:none}
.toolbar{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.seg{display:flex;background:rgba(19,28,43,.92);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;border-radius:5px;padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px #3a4c69}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(19,28,43,.94);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12.5px;color:var(--text);max-width:calc(100% - 24px);text-align:center;pointer-events:none}
.hint em{font-style:normal;color:var(--req)}
.legend{position:absolute;right:12px;top:12px;display:flex;gap:12px;background:rgba(19,28,43,.9);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:22px;color:var(--text);font-weight:600;margin-bottom:4px}
.rec{position:absolute;right:12px;bottom:14px;background:rgba(19,28,43,.95);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:var(--f-mono);font-size:12px;display:flex;gap:8px;align-items:center}
.rec .dot{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.bar{height:4px;width:120px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>div{height:100%;background:var(--req)}

/* right pane */
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.03em}
.field input[type=text],.field select{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.field input[type=range]{width:100%;accent-color:var(--req)}
.kv{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.kv .sw{width:10px;height:10px;border-radius:3px}
.chip{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
.flow{border:1px solid var(--line);border-radius:9px;padding:8px 9px;margin-bottom:8px;background:var(--raise)}
.flow.playing{border-color:var(--fc)}
.flow .hd{display:flex;align-items:center;gap:8px}
.flow .hd .sw{width:10px;height:10px;border-radius:50%;background:var(--fc);flex:none}
.flow .hd input{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 5px;font-weight:600}
.flow .hd input:hover,.flow .hd input:focus{border-color:var(--line);background:var(--panel)}
.flow .path{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;overflow-wrap:anywhere}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
.ctl label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.ctl input[type=checkbox]{accent-color:var(--req)}
.recsteps{display:grid;gap:6px;margin:8px 0}
.recstep{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center}
.recstep .no{font-family:var(--f-mono);font-size:11px;color:var(--req);text-align:right}
.recstep input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:12px;width:100%}
.recstep .nn{font-size:12px;font-weight:600}
.log{display:grid;gap:2px}
.hop{display:grid;grid-template-columns:20px 14px 1fr;gap:6px;align-items:start;padding:5px 6px;border-radius:6px;font-size:12px}
.hop .no{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.hop .ar{font-family:var(--f-mono);font-weight:600}
.hop.req .ar{color:var(--req)}
.hop.res .ar{color:var(--res)}
.hop.evt .ar{color:var(--evt)}
.hop.stream .ar{color:var(--str)}
.hop .tx{min-width:0;overflow-wrap:anywhere}
.hop .tx small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.hop.on{background:#1f2c41;box-shadow:inset 0 0 0 1px #34465f}
.hop.done{opacity:.55}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#22304a;border:1px solid #3a4c69;border-radius:8px;padding:9px 14px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.file-in{display:none}

/* inspector additions */
.field textarea{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;resize:vertical;font:inherit;line-height:1.45;color:var(--text)}
.numrow{display:flex;align-items:center;gap:6px}
.numrow input{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.numrow span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.row2f{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.util-wrap{display:grid;gap:6px;margin-top:2px}
.util-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.util{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.util>div{height:100%;border-radius:4px}
.warn{margin:0;color:var(--danger);font-size:12px}
.members{display:flex;flex-wrap:wrap;gap:5px}
.chip.link{background:transparent;cursor:pointer;color:var(--text)}
.chip.link:hover{border-color:var(--res);color:var(--res)}
.kind-desc{margin-top:4px;font-size:12px}
.note{margin-top:10px;border:1px dashed #3a4c69;border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);line-height:1.5}
.note b{display:block;color:var(--text);font-weight:600;margin-bottom:2px}
.traffic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.traffic>div{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
.traffic b{display:block;font-family:var(--f-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.traffic span{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow .rps{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.flow .rps input{width:90px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums}
.flow .rps label{font-family:var(--f-mono);font-size:11px}
.seg select{background:transparent;border:0;padding:4px 6px;font-size:12.5px;color:var(--text)}
.tip{position:absolute;z-index:6;max-width:280px;background:rgba(13,20,32,.97);border:1px solid #3a4c69;border-radius:9px;padding:9px 11px;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.4);display:grid;gap:3px}
.tip b{font-family:var(--f-display);font-size:16px;font-weight:600}
.tip .t{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.tip p{margin:2px 0 0;font-size:12.5px;line-height:1.45;color:#c3cfdf}
.tip .s{font-family:var(--f-mono);font-size:11px;color:#9fb0c8;font-variant-numeric:tabular-nums}

/* export menu */
.menu-wrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:330px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid #33435d;border-radius:12px;padding:6px 0;z-index:30;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.pop .blk{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.pop .blk:last-child{border-bottom:0}
.pop .blk h4{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pop .blk h4 small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:400}
.pop .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pop select{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;font-size:12.5px}
.pop .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pop .btn{justify-content:center}

/* tour */
.tour-catch{position:fixed;inset:0;z-index:40}
.tour-spot{position:fixed;z-index:41;border-radius:12px;border:2px solid var(--req);box-shadow:0 0 0 9999px rgba(4,8,15,.68);transition:all .28s ease;pointer-events:none}
.tour-dim{position:fixed;inset:0;z-index:41;background:rgba(4,8,15,.68);pointer-events:none}
.tour-card{position:fixed;z-index:42;width:320px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid #3a4c69;border-radius:12px;padding:16px 16px 14px;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:top .28s ease,left .28s ease}
.tour-card .step{font-family:var(--f-mono);font-size:11px;color:var(--req);letter-spacing:.06em}
.tour-card h4{margin:4px 0 6px;font-family:var(--f-display);font-size:21px;font-weight:600;text-wrap:balance}
.tour-card p{margin:0 0 14px;color:#c3cfdf;line-height:1.55;font-size:13.5px}
.tour-card .nav{display:flex;align-items:center;gap:6px}
.tour-card .dots{display:flex;gap:4px;margin-right:auto}
.tour-card .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tour-card .dots i.on{background:var(--req)}

/* help modal */
.modal-bg{position:fixed;inset:0;z-index:45;background:rgba(4,8,15,.66);display:grid;place-items:center;padding:16px}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid #3a4c69;border-radius:14px;padding:20px 22px}
.modal h2{margin:0 0 4px;font-family:var(--f-display);font-size:26px;font-weight:700}
.modal h5{margin:18px 0 8px;font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modal p,.modal li{color:#c3cfdf;line-height:1.55;font-size:13.5px}
.modal ul{margin:0;padding-left:18px}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
kbd{font-family:var(--f-mono);font-size:11.5px;background:var(--raise);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}

@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{display:flex;flex-direction:column}
  .stage{order:1;height:64vh;min-height:360px}
  .pane.right{order:2;border-left:0;border-top:1px solid var(--line)}
  .pane.left{order:3;border-right:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){.rec .dot{animation:none}}
</style>
</head>
<body>

<div id="root"></div>

<script>

function edgeBetween(edges,a,b){ return edges.find(e=>e.from===a&&e.to===b) || edges.find(e=>e.from===b&&e.to===a) || null; }
function computeLoads(d){
  const node={}, edge={};
  for(const f of d.flows||[]){ const r=Math.max(0,+f.rps||0); if(!r) continue;
    const seen=new Set(); for(const st of f.steps){ if(!seen.has(st.node)){ seen.add(st.node); node[st.node]=(node[st.node]||0)+r; } }
    for(let i=0;i<f.steps.length-1;i++){ const e=edgeBetween(d.edges,f.steps[i].node,f.steps[i+1].node); if(e) edge[e.id]=(edge[e.id]||0)+r; } }
  for(const g of d.nodes){ if(isGroupType(g.type)) node[g.id]=d.nodes.filter(n=>n.group===g.id).reduce((s,n)=>s+(node[n.id]||0),0); }
  return {node,edge};
}
const capOf = n => n && n.capacity>0 ? n.capacity*Math.max(1,n.replicas||1) : 0;
const utilOf = (n,load) => { const c=capOf(n); return c ? load/c : null; };
const utilColor = u => u==null ? null : u>=.9 ? '#ff6b6b' : u>=.7 ? '#ffcc4d' : '#4fd1a5';
const fmtRps = n => { n=+n||0; const f=(v,s)=>(v>=10?Math.round(v):Math.round(v*10)/10)+s; return n>=1e6?f(n/1e6,'M'):n>=1e3?f(n/1e3,'k'):String(Math.round(n)); };

/* request hops forward, then response hops back. One-way and streaming links carry no reply. */
function hopsOf(flow, edges){
  edges=edges||[]; const s=flow.steps, h=[];
  for(let i=0;i<s.length-1;i++){ const e=edgeBetween(edges,s[i].node,s[i+1].node), k=kindOf(e);
    h.push({from:s[i].node,to:s[i+1].node,dir:k==='oneway'?'evt':k==='stream'?'stream':'req',kind:k,edge:e&&e.id,note:s[i+1].note||''}); }
  for(let i=s.length-1;i>0;i--){ const e=edgeBetween(edges,s[i].node,s[i-1].node), k=kindOf(e);
    if(k==='oneway'||k==='stream') continue;
    h.push({from:s[i].node,to:s[i-1].node,dir:'res',kind:k,edge:e&&e.id,note:s[i].ret||'response'}); }
  return h;
}

function shade(hex,f){ const c=new T.Color(hex); c.multiplyScalar(f); return c; }

function add(g, geo, m, x,y,z){ const me=new T.Mesh(geo,m); me.position.set(x||0,y||0,z||0); me.castShadow=true; me.receiveShadow=true; g.add(me); return me; }

function buildShape(shape, color){
  const g = new T.Group(); let h = 1.2;
  const M = mat(color), D = mat(shade(color,.55)), L = glowMat(tint(color,.55));
  switch(shape){
    case 'server': case 'vm': {
      add(g,new T.BoxGeometry(1.5,1.6,1.5), shape==='vm'?mat(color,{transparent:true,opacity:.82}):M, 0,.8,0);
      if(shape==='vm') add(g,new T.BoxGeometry(.8,.8,.8),D,0,.8,0);
      for(let i=0;i<3;i++) add(g,new T.BoxGeometry(1.2,.07,.03),L,0,.35+i*.45,.77);
      h=1.6; break; }
    case 'monitor': {
      add(g,new T.BoxGeometry(2,1.25,.14),D,0,1.3,0); add(g,new T.BoxGeometry(1.84,1.1,.02),L,0,1.3,.08);
      add(g,new T.CylinderGeometry(.08,.08,.6,10),D,0,.4,0); add(g,new T.BoxGeometry(.9,.07,.5),M,0,.04,0);
      h=1.95; break; }
    case 'phone': {
      add(g,new T.BoxGeometry(.8,1.5,.14),D,0,.78,0); add(g,new T.BoxGeometry(.68,1.28,.02),L,0,.8,.08);
      add(g,new T.BoxGeometry(1.1,.06,.6),M,0,.03,0); h=1.55; break; }
    case 'iot': {
      add(g,new T.BoxGeometry(1,.55,1),M,0,.28,0); add(g,new T.CylinderGeometry(.04,.04,.7,8),D,.3,.9,.3);
      add(g,new T.SphereGeometry(.09,12,10),L,.3,1.27,.3); h=1.3; break; }
    case 'actor': {
      add(g,new T.CapsuleGeometry(.34,.62,6,14),M,0,.68,0); add(g,new T.SphereGeometry(.3,20,16),M,0,1.5,0); h=1.8; break; }
    case 'ext': {
      add(g,new T.DodecahedronGeometry(.82),mat(color,{flatShading:true}),0,.86,0); h=1.7; break; }
    case 'gateway': {
      add(g,new T.BoxGeometry(2.5,.5,1.1),M,0,.25,0);
      for(let i=-1;i<=1;i++) add(g,new T.BoxGeometry(.18,.55,.9),D,i*.8,.78,0);
      add(g,new T.BoxGeometry(2.3,.14,1),L,0,1.1,0); h=1.2; break; }
    case 'globe': {
      add(g,new T.SphereGeometry(.85,28,20),M,0,.9,0);
      const w=new T.Mesh(new T.SphereGeometry(.88,12,8),new T.MeshBasicMaterial({color:tint(color,.6),wireframe:true,transparent:true,opacity:.5}));
      w.position.y=.9; g.add(w); h=1.75; break; }
    case 'dns': {
      add(g,new T.CylinderGeometry(.28,.38,1.3,14),M,0,.65,0); add(g,new T.SphereGeometry(.36,18,14),L,0,1.55,0); h=1.9; break; }
    case 'wall': {
      add(g,new T.BoxGeometry(2.1,1.3,.4),M,0,.65,0);
      for(let r=0;r<3;r++) add(g,new T.BoxGeometry(2.12,.04,.42),D,0,.33+r*.33,0);
      h=1.3; break; }
    case 'lb': {
      add(g,new T.CylinderGeometry(1,1.05,.38,24),M,0,.19,0); add(g,new T.ConeGeometry(.45,.6,4),L,0,.68,0); h=1.0; break; }
    case 'ring': {
      const t=add(g,new T.TorusGeometry(.85,.15,12,40),M,0,.55,0); t.rotation.x=Math.PI/2;
      for(let i=0;i<5;i++){ const a=i/5*Math.PI*2; add(g,new T.SphereGeometry(.17,12,10),L,Math.cos(a)*.85,.55,Math.sin(a)*.85); }
      h=.9; break; }
    case 'container': {
      add(g,new T.BoxGeometry(1.3,1,1.3),M,0,.5,0);
      for(let i=-2;i<=2;i++) add(g,new T.BoxGeometry(.05,.9,1.32),D,i*.25,.5,0);
      h=1.0; break; }
    case 'cluster': {
      const p=[[-.42,-.42],[.42,-.42],[-.42,.42],[.42,.42]];
      p.forEach(([x,z])=>add(g,new T.BoxGeometry(.72,.72,.72),M,x,.36,z));
      add(g,new T.BoxGeometry(.72,.72,.72),L,0,1.08,0); h=1.45; break; }
    case 'octa': {
      add(g,new T.OctahedronGeometry(.82),mat(color,{flatShading:true}),0,.9,0); h=1.75; break; }
    case 'hex': {
      add(g,new T.CylinderGeometry(1,1,.7,6),M,0,.35,0); add(g,new T.CylinderGeometry(.82,.95,.16,6),L,0,.78,0); h=.9; break; }
    case 'orch': {
      add(g,new T.CylinderGeometry(1.05,1.05,.32,6),M,0,.16,0); add(g,new T.CylinderGeometry(.78,.78,.32,6),D,0,.48,0);
      add(g,new T.CylinderGeometry(.5,.5,.32,6),M,0,.8,0); add(g,new T.SphereGeometry(.2,14,12),L,0,1.12,0); h=1.3; break; }
    case 'db': {
      add(g,new T.CylinderGeometry(.82,.82,1.3,32),M,0,.65,0);
      [.3,.75].forEach(y=>{ const r=add(g,new T.TorusGeometry(.83,.035,8,40),D,0,y,0); r.rotation.x=Math.PI/2; });
      add(g,new T.CylinderGeometry(.7,.7,.03,32),L,0,1.31,0); h=1.32; break; }
    case 'cache': {
      add(g,new T.CylinderGeometry(.85,.85,.7,8),M,0,.35,0); add(g,new T.CylinderGeometry(.6,.6,.08,8),L,0,.74,0); h=.8; break; }
    case 'bucket': {
      add(g,new T.CylinderGeometry(.92,.62,1.15,28),M,0,.58,0);
      const r=add(g,new T.TorusGeometry(.92,.05,8,36),L,0,1.15,0); r.rotation.x=Math.PI/2; h=1.2; break; }
    case 'search': {
      const r=add(g,new T.TorusGeometry(.5,.13,12,32),M,0,1.1,0);
      add(g,new T.CircleGeometry(.42,28),new T.MeshBasicMaterial({color:tint(color,.6),transparent:true,opacity:.35,side:T.DoubleSide}),0,1.1,0);
      const hd=add(g,new T.CylinderGeometry(.1,.12,.75,10),D,.42,.38,0); hd.rotation.z=.6; h=1.7; break; }
    case 'warehouse': {
      add(g,new T.CylinderGeometry(1.1,1.1,.95,32),M,0,.48,0);
      [.25,.55].forEach(y=>{ const r=add(g,new T.TorusGeometry(1.11,.035,8,44),D,0,y,0); r.rotation.x=Math.PI/2; });
      add(g,new T.CylinderGeometry(.95,.95,.03,32),L,0,.96,0); h=1.0; break; }
    case 'queue': {
      for(let i=0;i<3;i++) add(g,new T.BoxGeometry(1.9,.24,.95),i===2?L:M,0,.14+i*.32,0); h=.95; break; }
    case 'stream': {
      add(g,new T.BoxGeometry(2.7,.4,.8),M,0,.2,0);
      for(let i=0;i<5;i++) add(g,new T.BoxGeometry(.06,.42,.82),L,-1.08+i*.54,.2,0);
      h=.5; break; }
    case 'broadcast': {
      add(g,new T.CylinderGeometry(.2,.32,1,12),M,0,.5,0);
      [.45,.7].forEach((r,i)=>{ const t=add(g,new T.TorusGeometry(r,.05,8,32),L,0,1.15+i*.18,0); t.rotation.x=Math.PI/2; });
      add(g,new T.SphereGeometry(.2,14,12),L,0,1.1,0); h=1.45; break; }
    case 'ops': {
      add(g,new T.SphereGeometry(.65,26,18),M,0,.8,0);
      const t=add(g,new T.TorusGeometry(.95,.04,8,48),L,0,.8,0); t.rotation.x=1.2; t.rotation.y=.3; h=1.55; break; }
    default: add(g,new T.BoxGeometry(1.4,1,1.4),M,0,.5,0); h=1;
  }
  return {group:g, h};
}

function roundRect(x,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
/* Labels are drawn on large canvases (LK = supersample factor) so they stay crisp in 4K/8K exports.

function wrapText(x,text,maxW,maxLines){
  const words=String(text||'').split(/\s+/).filter(Boolean), lines=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(x.measureText(t).width<=maxW) cur=t; else { if(cur) lines.push(cur); cur=w; } if(lines.length===maxLines) break; }
  if(lines.length<maxLines&&cur) lines.push(cur);
  if(lines.length===maxLines && words.join(' ').length>lines.join(' ').length){ let l=lines[maxLines-1]; while(l.length>1&&x.measureText(l+'…').width>maxW) l=l.slice(0,-1); lines[maxLines-1]=l+'…'; }
  return lines;
}
function makeLabel(title, sub, accent, opts){
  opts=opts||{}; const K=LK, W=640*K;
  const disp=s=>`600 ${s}px "Barlow Semi Condensed","Arial Narrow",sans-serif`, mono=`500 ${25*K}px "IBM Plex Mono",monospace`,
        body=`400 ${23*K}px "IBM Plex Sans",system-ui,sans-serif`, stat=`600 ${24*K}px "IBM Plex Mono",monospace`;
  const meas=document.createElement('canvas').getContext('2d');
  meas.font=body; const lines=opts.lines&&opts.lines.length?wrapText(meas,opts.lines.join(' '),W-110*K,2):[];
  const H=(150+lines.length*32+(lines.length?10:0)+(opts.status?38:0))*K;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  let ts=50*K; x.font=disp(ts); while(x.measureText(title).width>W-80*K && ts>28*K){ ts-=2*K; x.font=disp(ts); }
  let bw=x.measureText(title).width; x.font=mono; const sw=x.measureText(sub).width+26*K; bw=Math.max(bw,sw);
  x.font=body; lines.forEach(l=>bw=Math.max(bw,x.measureText(l).width)); if(opts.status){ x.font=stat; bw=Math.max(bw,x.measureText(opts.status.text).width+26*K); }
  bw=Math.min(W-8*K,bw+56*K);
  roundRect(x,(W-bw)/2,10*K,bw,H-20*K,22*K); x.fillStyle='rgba(10,17,29,0.9)'; x.fill();
  x.lineWidth=(opts.border?4:2.5)*K; x.strokeStyle=opts.border||accent+'88'; x.stroke();
  x.textAlign='center'; x.fillStyle='#ecf2fa'; x.font=disp(ts); x.fillText(title,W/2,70*K);
  x.font=mono; x.fillStyle=accent; x.fillText(sub,W/2+12*K,114*K);
  x.beginPath(); x.arc(W/2-sw/2+4*K,105*K,6*K,0,Math.PI*2); x.fill();
  let y=114*K;
  if(lines.length){ x.font=body; x.fillStyle='#b9c6d8'; y+=10*K; lines.forEach(l=>{ y+=32*K; x.fillText(l,W/2,y); }); }
  if(opts.status){ y+=38*K; x.font=stat; x.fillStyle=opts.status.color||'#9fb0c8'; x.fillText(opts.status.text,W/2,y); }

  sp.center.set(.5,0); sp.scale.set(3.6,3.6*H/W,1); sp.renderOrder=20; return sp;

const TAG_CACHE=new Map();
function makeTag(text,border){
  const key=text+'|'+(border||'');
  let tex=TAG_CACHE.get(key);
  if(!tex){ const K=LK, W=380*K,H=64*K,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
    x.font=`500 ${27*K}px "IBM Plex Mono",monospace`; const w=Math.min(W-6*K,x.measureText(text).width+30*K);
    roundRect(x,(W-w)/2,8*K,w,H-16*K,14*K); x.fillStyle='rgba(14,22,36,0.92)'; x.fill(); x.strokeStyle=border||'#3a4c69'; x.lineWidth=2*K; x.stroke();
    x.fillStyle='#c0cee2'; x.textAlign='center'; x.fillText(text,W/2,43*K);
    tex=labelTexture(c); tex.userData={shared:true}; TAG_CACHE.set(key,tex); if(TAG_CACHE.size>400){ const k=TAG_CACHE.keys().next().value; TAG_CACHE.get(k).dispose(); TAG_CACHE.delete(k); } }

}
function clearTagCache(){ TAG_CACHE.forEach(t=>t.dispose()); TAG_CACHE.clear(); }
let GLOW_TEX=null;
function glowTex(){ if(GLOW_TEX) return GLOW_TEX; const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.3,'rgba(255,255,255,.45)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); GLOW_TEX=new T.CanvasTexture(c); GLOW_TEX.userData={shared:true}; return GLOW_TEX; }
function disposeTree(o){ o.traverse(m=>{ if(m.geometry) m.geometry.dispose(); if(m.material){ (Array.isArray(m.material)?m.material:[m.material]).forEach(mm=>{ ['map','alphaMap'].forEach(k=>{ const t=mm[k]; if(t&&!(t.userData&&t.userData.shared)) t.dispose(); }); mm.dispose(); }); } }); }

function drawStamp(ctx,w,h,title,sub){
  const s=Math.max(.6,w/1500); ctx.save();
  ctx.font=`600 ${Math.round(22*s)}px "Barlow Semi Condensed","Arial Narrow",sans-serif`;
  const tw=ctx.measureText(title).width; ctx.font=`500 ${Math.round(12*s)}px "IBM Plex Mono",monospace`;
  const sw=ctx.measureText(sub).width; const bw=Math.max(tw,sw)+28*s, bh=56*s, X=14*s, Y=h-bh-14*s;
  roundRect(ctx,X,Y,bw,bh,8*s); ctx.fillStyle='rgba(13,20,32,.88)'; ctx.fill(); ctx.strokeStyle='#2c3b54'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#ecf2fa'; ctx.font=`600 ${Math.round(22*s)}px "Barlow Semi Condensed","Arial Narrow",sans-serif`; ctx.fillText(title,X+14*s,Y+25*s);
  ctx.fillStyle='#8395ad'; ctx.font=`500 ${Math.round(12*s)}px "IBM Plex Mono",monospace`; ctx.fillText(sub,X+14*s,Y+44*s);

const UP=new T.Vector3(0,1,0);
function taper(t){ return Math.min(1,t*5,(1-t)*5); }
/* a copy of curve shifted sideways (horizontal perpendicular), converging at the ends */
function offsetCurve(curve,off){ const pts=[]; for(let i=0;i<=48;i++){ const t=i/48, p=curve.getPoint(t), tn=curve.getTangent(t);
  const perp=new T.Vector3(-tn.z,0,tn.x).normalize(); pts.push(p.addScaledVector(perp,off*taper(t))); } return new T.CatmullRomCurve3(pts); }

function braidCurve(curve,r,phase){ const len=curve.getLength(), turns=Math.max(1.5,len/2.6), pts=[];
  for(let i=0;i<=96;i++){ const t=i/96, p=curve.getPoint(t), tn=curve.getTangent(t).normalize();
    const perp=new T.Vector3(-tn.z,0,tn.x).normalize(), bin=new T.Vector3().crossVectors(tn,perp).normalize(), a=t*Math.PI*2*turns+phase, rr=r*taper(t);

/* ---------------- scene engine ---------------- */
class ArchScene {

    r.setPixelRatio(this.basePR()); r.shadowMap.enabled=true; r.shadowMap.type=T.PCFSoftShadowMap;
    host.appendChild(r.domElement);
    const sc=this.scene=new T.Scene(); sc.background=new T.Color(BG); sc.fog=new T.Fog(BG,55,120);
    this.camera=new T.PerspectiveCamera(40,1,.1,400); this.camera.position.set(16,19,22);
    const ctl=this.controls=new T.OrbitControls(this.camera,r.domElement);
    ctl.enableDamping=true; ctl.dampingFactor=.08; ctl.maxPolarAngle=1.48; ctl.minDistance=5; ctl.maxDistance=110;
    sc.add(new T.HemisphereLight(0xc4d8ff,0x18202e,.85));

    sc.add(dl); this.dl=dl;

    gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; sc.add(gnd);
    const grid=new T.GridHelper(160,160,0x22324b,0x172336); grid.position.y=.003; sc.add(grid);
    this.zoneLayer=new T.Group(); this.groupLayer=new T.Group(); this.nodeLayer=new T.Group(); this.edgeLayer=new T.Group(); this.fxLayer=new T.Group();
    sc.add(this.zoneLayer,this.groupLayer,this.nodeLayer,this.edgeLayer,this.fxLayer);
    this.nodes=new Map(); this.edges=new Map(); this.groups=new Map();
    this.data={nodes:[],edges:[],flows:[]}; this.loads={node:{},edge:{}}; this.labelMode='basic';
    this.packets=[]; this.pulses=[]; this.journeys=[]; this.liveAcc={}; this.speed=1; this.live=false; this.flowRun=null; this.hl=null; this.animTex=[];
    this.sel=null; this.marked=new Set(); this.mode='select'; this.selRings=[]; this.markRings=[];

  /* ---------- data sync ---------- */
  setData(d, opts){

    this.data={nodes:d.nodes,edges:d.edges,flows:d.flows||[]}; this.loads=computeLoads(this.data);
    const blocks=d.nodes.filter(n=>!isGroupType(n.type)), keep=new Set(blocks.map(n=>n.id));
    for(const [id,o] of this.nodes){ if(!keep.has(id)){ o.group.parent.remove(o.group); disposeTree(o.group); this.nodes.delete(id); } }
    for(const n of blocks){

  /* ---------- picking and dragging ---------- */

  /* ---------- camera ---------- */
  view(kind){
    const dir= kind==='top'?new T.Vector3(0,1,.02): kind==='front'?new T.Vector3(0,.42,1): new T.Vector3(.55,.72,.78);

    this.fitPrecise(dir,.86);

  blocks(){ return this.data.nodes.filter(n=>!isGroupType(n.type)); }
  framePoints(){ const pts=[];
    for(const n of this.blocks()){ const o=this.nodes.get(n.id); if(!o) continue;
      if(o.zone){ const w=(n.w||10)/2,d=(n.d||8)/2; [[-w,-d],[w,-d],[-w,d],[w,d]].forEach(([a,b])=>pts.push(new T.Vector3(n.x+a,0,n.z+b))); pts.push(new T.Vector3(n.x-w+3.6,1.1,n.z+d)); }
      else { [[-1.2,-1],[1.2,-1],[-1.2,1],[1.2,1]].forEach(([a,b])=>pts.push(new T.Vector3(n.x+a,0,n.z+b))); pts.push(new T.Vector3(n.x-1.8,o.h+1.6,n.z),new T.Vector3(n.x+1.8,o.h+1.6,n.z)); } }

  /* Place the camera along dir so every block and label fits inside +-margin of the frame (NDC), centred. */
  fitPrecise(dir,margin){

    const target=this.center(), v=new T.Vector3();
    const measure=d=>{ cam.position.copy(target).addScaledVector(dir,d); cam.lookAt(target); cam.updateMatrixWorld(); cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
      let a=1e9,b=-1e9,c=1e9,e=-1e9; for(const p of pts){ v.copy(p).project(cam); if(v.x<a)a=v.x; if(v.x>b)b=v.x; if(v.y<c)c=v.y; if(v.y>e)e=v.y; } return {a,b,c,e}; };

  restoreCam(){ if(!this._cam) return; this.camera.position.copy(this._cam.p); this.controls.target.copy(this._cam.t); this.controls.update(); this._cam=null; }

  /* ---------- packets ---------- */
  packet(curve,rev,color,o){

    const m=new T.Mesh(new T.SphereGeometry(sz,16,12),new T.MeshBasicMaterial({color}));
    const gl=new T.Sprite(new T.SpriteMaterial({map:glowTex(),color,transparent:true,blending:T.AdditiveBlending,depthWrite:false}));
    gl.material.userData={sharedMap:true}; gl.scale.setScalar(o.small?.7:1.25); m.add(gl);
    const trail=[]; for(let i=0;i<(o.small?2:4);i++){ const t=new T.Mesh(new T.SphereGeometry(sz*(.75-i*.14),10,8),new T.MeshBasicMaterial({color,transparent:true,opacity:.55-i*.12})); t.visible=false; this.fxLayer.add(t); trail.push(t); }

      if(h.dir==='req') this.packet(fwd?o.lanes[1]:o.lanes[0],fwd,RES_COLOR,{small:true,scale:.9}); // the other side talks at the same time

    } else this.packet(o.curve,!fwd,color,{small,onArrive:done});

    const r=new T.Mesh(new T.RingGeometry(.9,1.1,40),new T.MeshBasicMaterial({color,transparent:true,opacity:.9,side:T.DoubleSide}));
    r.rotation.x=-Math.PI/2; r.position.set(o.group.position.x,.03,o.group.position.z); this.fxLayer.add(r);

  playFlow(flow,loop){ this.stopFlow(); const hops=hopsOf(flow,this.data.edges); if(!hops.length) return; this.flowRun={flow,hops,i:0,loop,wait:.25,busy:false}; this.setHighlight(flow); }

/* ---------------- GIF encoder (median-cut palette, 6-bit lazy LUT, LZW) ---------------- */
function makeQuantizer(samples, extras){

    const k=((r>>3)<<10)|((g>>3)<<5)|(b>>3); hist[k]+=w; sr[k]+=r*w; sg[k]+=g*w; sb[k]+=b*w; };

  const bg=new T.Color(BG), bgc=[bg.r*255,bg.g*255,bg.b*255], wt=Math.max(50,total*.003);
  (extras||[]).forEach(hex=>{ const c=new T.Color(hex), base=[c.r*255,c.g*255,c.b*255];
    [0,.25,.5,.7,.85].forEach(t=>addPx(base[0]+(bgc[0]-base[0])*t,base[1]+(bgc[1]-base[1])*t,base[2]+(bgc[2]-base[2])*t,wt));
    [.35,.7].forEach(t=>addPx(base[0]+(255-base[0])*t,base[1]+(255-base[1])*t,base[2]+(255-base[2])*t,wt)); });
  const cols=[]; for(let c=0;c<32768;c++) if(hist[c]) cols.push(c);
  const ch=(c,k)=>k===0?(c>>10)&31:k===1?(c>>5)&31:c&31;
  const stat=b=>{ const mn=[31,31,31],mx=[0,0,0]; let n=0; for(const c of b.cols){ for(let k=0;k<3;k++){ const v=ch(c,k); if(v<mn[k])mn[k]=v; if(v>mx[k])mx[k]=v; } n+=hist[c]; }
    const rg=[mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]], m=Math.max(...rg); b.k=rg.indexOf(m); b.score=Math.sqrt(n)*(m+1); b.n=n; return b; };
  const boxes=[stat({cols})];
  while(boxes.length<256){
    let bi=-1,bs=-1; boxes.forEach((b,i)=>{ if(b.cols.length>1&&b.score>bs){bs=b.score;bi=i;} }); if(bi<0) break;
    const b=boxes[bi]; b.cols.sort((x,y)=>ch(x,b.k)-ch(y,b.k));

    pr[i]=r/n; pg[i]=g/n; pb[i]=bl/n; pal[i*3]=Math.round(pr[i]); pal[i*3+1]=Math.round(pg[i]); pal[i*3+2]=Math.round(pb[i]); });

  const nearest=(r,g,b)=>{ let best=0,bd=1e12; for(let i=0;i<P;i++){ const dr=r-pr[i],dg=g-pg[i],db=b-pb[i]; const d=dr*dr*.3+dg*dg*.59+db*db*.11; if(d<bd){bd=d;best=i;} } return best; };

}
function lzw(idx,out){
  const MIN=8, CLEAR=256, EOI=257; let size=9, next=258; const dict=new Map();

    if(v!==undefined){ prefix=v; continue; }

    else { if(next>=(1<<size)) size++; dict.set(key,next++); }
    prefix=k; }

async function encodeGIF({w,h,frames,pal,delay},onProgress){

  head.push(0x21,0xFF,0x0B); for(const c of 'NETSCAPE2.0') head.push(c.charCodeAt(0)); head.push(3,1,0,0,0);
  parts.push(new Uint8Array(head));

    const pre=[0x21,0xF9,4,0x04,delay&255,delay>>8,0,0, 0x2C,0,0,0,0,w&255,w>>8,h&255,h>>8,0];
    parts.push(lzw(frames[f],pre)); frames[f]=null;

/* ---------------- zip writer (stored, no compression) ---------------- */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();

function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const d=new Date(), time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,time,true); lh.setUint16(12,date,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,time,true); ch.setUint16(14,date,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  }
  const cdSize=central.reduce((s,a)=>s+a.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cdSize,true); end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
}

    return html`<div className="sec"><h3>Block <span className="chip">${m.provider||m.cat}</span></h3>

        <div className="field"><label htmlFor="zone-d">Depth ${n.d}</label><input id="zone-d" type="range" min="4" max="40" step="0.5" value=${n.d} onInput=${e=>update('node',n.id,{d:+e.target.value})} /></div></div>`

      <div className="grp" style=${{marginTop:10}}>
        ${m.shape!=='zone'&&html`<button className="btn sm" onClick=${()=>startConnect(n.id)}>Connect from here</button>`}
        <button className="btn sm danger" onClick=${()=>remove(sel)}>Delete</button>
      </div></div>`;
  }
  const e=diagram.edges.find(e=>e.id===sel.id); if(!e) return null; const k=kindOf(e), load=loads.edge[e.id]||0;
  return html`<div className="sec"><h3>Connection</h3>
    <div className="kv">${nameOf(e.from)} → ${nameOf(e.to)}${load?html` · <b style=${{color:'var(--text)'}}>${fmtRps(load)} req/s</b>`:''}</div>

function Tour({onClose}){
  const [i,setI]=useState(0); const [rect,setRect]=useState(null); const [vp,setVp]=useState({w:innerWidth,h:innerHeight});
  const step=TOUR[i], last=i===TOUR.length-1;
  useEffect(()=>{
    let el=step.sel?document.querySelector(step.sel):null; if(el&&!el.getClientRects().length) el=null;
    const measure=()=>{ setVp({w:innerWidth,h:innerHeight}); setRect(el?el.getBoundingClientRect():null); };
    if(el&&innerWidth<=980) el.scrollIntoView({block:'center',behavior:'smooth'});
    measure(); const t=setTimeout(measure,380);
    addEventListener('resize',measure); addEventListener('scroll',measure,true);
    return ()=>{ clearTimeout(t); removeEventListener('resize',measure); removeEventListener('scroll',measure,true); };
  },[i]);
  useEffect(()=>{ const k=e=>{ if(e.key==='Escape') onClose(); if(e.key==='ArrowRight') setI(v=>Math.min(TOUR.length-1,v+1)); if(e.key==='ArrowLeft') setI(v=>Math.max(0,v-1)); };
    addEventListener('keydown',k); return ()=>removeEventListener('keydown',k); },[]);
  const CW=Math.min(320,vp.w-32), CH=210, G=14; let pos;
  if(!rect) pos={left:(vp.w-CW)/2,top:Math.max(16,(vp.h-CH)/2)};
  else {
    const r=rect, cands=[
      {left:r.right+G,top:r.top+r.height/2-CH/2,ok:r.right+G+CW<vp.w-12},
      {left:r.left-G-CW,top:r.top+r.height/2-CH/2,ok:r.left-G-CW>12},
      {left:r.left+r.width/2-CW/2,top:r.bottom+G,ok:r.bottom+G+CH<vp.h-12},
      {left:r.left+r.width/2-CW/2,top:r.top-G-CH,ok:r.top-G-CH>12},
      {left:r.left+16,top:r.bottom-CH-16,ok:true}];
    pos=cands.find(c=>c.ok);
  }
  pos={left:Math.max(16,Math.min(vp.w-CW-16,pos.left)),top:Math.max(16,Math.min(vp.h-CH-16,pos.top))};
  return html`<div>
    <div className="tour-catch" onClick=${e=>e.stopPropagation()}></div>
    ${rect?html`<div className="tour-spot" style=${{left:rect.left-6,top:rect.top-6,width:rect.width+12,height:rect.height+12}}></div>`:html`<div className="tour-dim"></div>`}
    <div className="tour-card" role="dialog" aria-label="Guided tour" style=${{left:pos.left,top:pos.top,width:CW}}>
      <div className="step">STEP ${i+1} OF ${TOUR.length}</div>
      <h4>${step.title}</h4><p>${step.body}</p>
      <div className="nav">
        <div className="dots">${TOUR.map((_,k)=>html`<i key=${k} className=${k===i?'on':''}></i>`)}</div>
        ${i>0?html`<button className="btn sm" onClick=${()=>setI(i-1)}>Back</button>`:html`<button className="btn sm ghost" onClick=${onClose}>Skip</button>`}
        <button className="btn sm primary" onClick=${()=>last?onClose():setI(i+1)}>${last?'Finish':'Next'}</button>
      </div>
    </div>
  </div>`;
}

/* drop groups with no members left */
function cleanGroups(d){ const used=new Set(d.nodes.filter(n=>n.group).map(n=>n.group));
  const groupIds=new Set(d.nodes.filter(n=>isGroupType(n.type)).map(n=>n.id));
  return {...d,nodes:d.nodes.filter(n=>!isGroupType(n.type)||used.has(n.id)).map(n=>n.group&&!groupIds.has(n.group)?{...n,group:undefined}:n)}; }
const HOP_ARROW={req:'→',res:'←',evt:'⇢',stream:'⇉'};
const HOP_WORD={req:'request',res:'response',evt:'event, no reply',stream:'stream'};

function App(){
  const hostRef=useRef(null), sceneRef=useRef(null), fileRef=useRef(null), tipRef=useRef(null);
  const [diagram,setDiagram]=useState(()=>loadLocal()||TEMPLATES.ecommerce());
  const [sel,setSel]=useState(null);
  const [mode,setMode]=useState('select');
  const [connectFrom,setConnectFrom]=useState(null);
  const [connectKind,setConnectKind]=useState('request');
  const [rec,setRec]=useState(null); // {name, steps:[{node,note,ret}]}
  const [playing,setPlaying]=useState(null);
  const [hop,setHop]=useState(-1);
  const [speed,setSpeed]=useState(1);
  const [loop,setLoop]=useState(true);
  const [live,setLive]=useState(false);
  const [labelMode,setLabelMode]=useState('basic');
  const [gifSecs,setGifSecs]=useState(5);
  const [gifW,setGifW]=useState(1280);
  const [gifFps,setGifFps]=useState(12);
  const [pngW,setPngW]=useState(3840);
  const [menuOpen,setMenuOpen]=useState(false);
  const [tour,setTour]=useState(false);
  const [help,setHelp]=useState(false);
  const [aspect,setAspect]=useState(1.6);
  const [frame,setFrame]=useState('16:9');
  const [fitExport,setFitExport]=useState(true);
  const [busy,setBusy]=useState(null); // {label, p}
  const [toast,setToast]=useState('');
  const S=useRef({}); S.current={mode,connectFrom,connectKind,rec,diagram,playing,loop,sel};
  const loads=useMemo(()=>computeLoads(diagram),[diagram]);

  const say=useCallback(t=>{ setToast(t); clearTimeout(say.t); say.t=setTimeout(()=>setToast(''),3000); },[]);

  // scene lifecycle
  useEffect(()=>{
    const sc=new ArchScene(hostRef.current,{
      onPick:(hit,mods)=>handlePick(hit,mods||{}),
      onMoveMany:list=>{ const m=new Map(list.map(p=>[p.id,p])); setDiagram(d=>({...d,nodes:d.nodes.map(n=>m.has(n.id)?{...n,x:m.get(n.id).x,z:m.get(n.id).z}:n)})); },
      onHop:i=>setHop(i),
      onFlowEnd:()=>{ setPlaying(null); setHop(-1); },
      onHover:(h,x,y)=>showTip(h,x,y)
    });
    sceneRef.current=sc; window.__arch=sc;
    sc.setData(S.current.diagram); sc.view('iso');
    const t=setTimeout(()=>{ const f=S.current.diagram.flows[0]; if(f){ sc.playFlow(f,true); setPlaying(f.id); } },700);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ clearTagCache(); sc.refreshLabels(); });
    return ()=>{ clearTimeout(t); sc.destroy(); };
  },[]);
  useEffect(()=>{ const sc=sceneRef.current; if(sc) sc.setData(diagram,{labelMode}); saveLocal(diagram); },[diagram,labelMode]);
  useEffect(()=>{ let seen=false; try{ seen=localStorage.getItem(LS+'.tour')==='done'; }catch(e){}
    const t=seen?null:setTimeout(()=>setTour(true),1200);
    const el=hostRef.current; const ro=new ResizeObserver(()=>{ if(el.clientHeight) setAspect(el.clientWidth/el.clientHeight); }); ro.observe(el);
    return ()=>{ t&&clearTimeout(t); ro.disconnect(); }; },[]);
  function closeTour(){ setTour(false); try{ localStorage.setItem(LS+'.tour','done'); }catch(e){} }
  useEffect(()=>{ sceneRef.current&&sceneRef.current.setSelection(sel); },[sel]);
  useEffect(()=>{ const sc=sceneRef.current; if(!sc) return; sc.mode=mode; sc.setMarked(mode==='connect'&&connectFrom?[connectFrom]:mode==='record'&&rec?rec.steps.map(s=>s.node):[]); },[mode,connectFrom,rec]);
  useEffect(()=>{ if(sceneRef.current) sceneRef.current.speed=speed; },[speed]);
  useEffect(()=>{ if(sceneRef.current) sceneRef.current.live=live; },[live]);
  useEffect(()=>{ sceneRef.current&&sceneRef.current.setLoop(loop); },[loop]);

  /* hover tooltip, written straight to the DOM so mouse moves don't re-render the app */
  function showTip(h,x,y){
    const el=tipRef.current; if(!el) return;
    if(!h||S.current.mode!=='select'&&h.kind!=='node'){ el.hidden=true; return; }
    const d=S.current.diagram, L=computeLoads(d); el.textContent='';
    const add=(tag,cls,text,color)=>{ const n=document.createElement(tag); if(cls) n.className=cls; n.textContent=text; if(color) n.style.color=color; el.appendChild(n); };
    if(h.kind==='edge'){ const e=d.edges.find(e=>e.id===h.id); if(!e){ el.hidden=true; return; } const k=kindOf(e);
      const nm=id=>(d.nodes.find(n=>n.id===id)||{}).name||'?';
      add('b','',nm(e.from)+' → '+nm(e.to)); add('span','t',CONNECTORS[k].label+(e.label?' · '+e.label:'')); add('p','',CONNECTORS[k].desc);
      if(L.edge[e.id]) add('span','s',fmtRps(L.edge[e.id])+' req/s');
    } else { const n=d.nodes.find(n=>n.id===h.id); if(!n){ el.hidden=true; return; } const m=meta(n.type), load=L.node[n.id]||0, u=utilOf(n,load), c=capOf(n);
      add('b','',n.name); add('span','t',(m.provider?m.provider+' · ':'')+m.label); const ds=descOf(n); if(ds) add('p','',ds);
      if(load||c) add('span','s',(load?fmtRps(load)+' req/s':'idle')+(c?' · capacity '+fmtRps(c)+(load?' ('+Math.round(u*100)+'%)':''):''),utilColor(u));
      if(isGroupType(n.type)) add('span','s',d.nodes.filter(x=>x.group===n.id).length+' blocks inside');
    }
    const host=hostRef.current.getBoundingClientRect(); el.hidden=false;
    const w=el.offsetWidth, hh=el.offsetHeight; let left=x-host.left+16, top=y-host.top+16;
    if(left+w>host.width-8) left=x-host.left-w-16; if(top+hh>host.height-8) top=y-host.top-hh-16;
    el.style.left=Math.max(8,left)+'px'; el.style.top=Math.max(8,top)+'px';
  }

  function handlePick(hit,mods){
    const {mode,connectFrom,rec,sel}=S.current;
    const isBlock=hit&&hit.kind==='node'&&!hit.zone&&!hit.group;
    if(mode==='connect'){
      if(!isBlock) return;
      if(!connectFrom){ setConnectFrom(hit.id); return; }
      if(hit.id===connectFrom) return;
      addEdge(connectFrom,hit.id); setConnectFrom(hit.id); return;
    }
    if(mode==='record'){
      if(!isBlock) return;
      if(rec.steps.length && rec.steps[rec.steps.length-1].node===hit.id) return;
      setRec(r=>({...r,steps:[...r.steps,{node:hit.id,note:'',ret:''}]})); return;
    }
    if(mods.shift&&isBlock){
      const cur=sel&&sel.kind==='multi'?sel.ids.slice():sel&&sel.kind==='node'&&!isGroupType((S.current.diagram.nodes.find(n=>n.id===sel.id)||{}).type)&&!isZoneType((S.current.diagram.nodes.find(n=>n.id===sel.id)||{}).type)?[sel.id]:[];
      const i=cur.indexOf(hit.id); if(i>=0) cur.splice(i,1); else cur.push(hit.id);
      setSel(cur.length>1?{kind:'multi',ids:cur}:cur.length?{kind:'node',id:cur[0]}:null); return;
    }
    setSel(hit?{kind:hit.kind,id:hit.id}:null);
  }
  function addEdge(a,b){
    const k=S.current.connectKind;
    setDiagram(d=>{ if(d.edges.some(e=>e.from===a&&e.to===b)) return d; return {...d,edges:[...d.edges,{id:uid('e'),from:a,to:b,label:CONNECTORS[k].proto,kind:k}]}; });
  }
  function addNode(type){
    const m=meta(type), sc=sceneRef.current; const p=sc?sc.freeSpot():{x:0,z:0};
    const n={id:uid('n'),type,name:m.label,x:p.x,z:p.z}; if(m.shape==='zone'){ n.w=10; n.d=8; }
    setDiagram(d=>({...d,nodes:m.shape==='zone'?[n,...d.nodes]:[...d.nodes,n]})); setSel({kind:'node',id:n.id}); setMode('select');
  }
  function update(kind,id,patch){
    setDiagram(d=> cleanGroups(kind==='node'?{...d,nodes:d.nodes.map(n=>n.id===id?{...n,...patch}:n)}:{...d,edges:d.edges.map(e=>e.id===id?{...e,...patch}:e)}));
  }
  function removeNodes(ids){
    const set=new Set(ids); stopFlow();
    setDiagram(d=>cleanGroups({...d,nodes:d.nodes.filter(n=>!set.has(n.id)).map(n=>set.has(n.group)?{...n,group:undefined}:n),edges:d.edges.filter(e=>!set.has(e.from)&&!set.has(e.to)),
      flows:d.flows.map(f=>({...f,steps:f.steps.filter(st=>!set.has(st.node))})).filter(f=>f.steps.length>1)}));
  }
  function remove(s){
    if(!s) return;
    if(s.kind==='multi') removeNodes(s.ids);
    else if(s.kind==='node'){ const n=diagram.nodes.find(x=>x.id===s.id); if(n&&isGroupType(n.type)) ungroup(n.id); else removeNodes([s.id]); }
    else setDiagram(d=>({...d,edges:d.edges.filter(e=>e.id!==s.id)}));
    setSel(null);
  }
  function makeGroup(kind,name){
    const s=S.current.sel; if(!s||s.kind!=='multi') return; const ids=new Set(s.ids), gid=uid('g');
    setDiagram(d=>{ const mem=d.nodes.filter(n=>ids.has(n.id)), x=mem.reduce((a,n)=>a+n.x,0)/mem.length, z=mem.reduce((a,n)=>a+n.z,0)/mem.length;
      return cleanGroups({...d,nodes:[...d.nodes.map(n=>ids.has(n.id)?{...n,group:gid}:n),{id:gid,type:kind,name,x,z}]}); });
    setSel({kind:'node',id:gid}); say('Grouped '+ids.size+' blocks into '+name+'. Drag its floor to move them together.');
  }
  function ungroup(gid){ setDiagram(d=>({...d,nodes:d.nodes.filter(n=>n.id!==gid).map(n=>n.group===gid?{...n,group:undefined}:n)})); setSel(null); }
  function startConnect(id){ setMode('connect'); setConnectFrom(id||null); }
  function setModeSafe(m){ setMode(m); setConnectFrom(null); if(m!=='record') setRec(null); }
  function setFlow(id,patch){ setDiagram(d=>({...d,flows:d.flows.map(x=>x.id===id?{...x,...patch}:x)})); }

  function play(f){ const sc=sceneRef.current; if(!sc) return; sc.playFlow(f,loop); setPlaying(f.id); setHop(-1); }
  function stopFlow(){ sceneRef.current&&sceneRef.current.stopFlow(); setPlaying(null); setHop(-1); }
  function startRecord(){ stopFlow(); setSel(null); setRec({name:'New flow '+(S.current.diagram.flows.length+1),steps:[]}); setMode('record'); }
  function saveRecord(){
    if(!rec||rec.steps.length<2){ say('A flow needs at least two blocks.'); return; }
    const f={id:uid('f'),name:rec.name||'Flow',color:FLOW_COLORS[diagram.flows.length%FLOW_COLORS.length],rps:100,steps:rec.steps};
    setDiagram(d=>{ let edges=d.edges.slice(); for(let i=0;i<f.steps.length-1;i++){ const a=f.steps[i].node,b=f.steps[i+1].node;
      if(!edges.some(e=>(e.from===a&&e.to===b)||(e.from===b&&e.to===a))) edges.push({id:uid('e'),from:a,to:b,label:'HTTPS',kind:'request'}); }
      return {...d,edges,flows:[...d.flows,f]}; });
    setRec(null); setMode('select'); setTimeout(()=>play(f),60); say('Flow saved at 100 req/s. Missing connections were added.');
  }
  function loadTemplate(k){ stopFlow(); setSel(null); setModeSafe('select'); const d=TEMPLATES[k](); setDiagram(d);
    setTimeout(()=>{ const sc=sceneRef.current; if(!sc) return; sc.view('iso'); if(d.flows[0]) play(d.flows[0]); },60); }

  // keyboard
  useEffect(()=>{ const kd=e=>{ const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='select'||tag==='textarea') return;
      const s=S.current.sel;
      if((e.key==='Delete'||e.key==='Backspace')&&s){ e.preventDefault(); remove(s); }
      if(e.key==='Escape'){ setModeSafe('select'); setSel(null); }
      if(e.metaKey||e.ctrlKey||e.altKey) return;
      if(e.key==='c'||e.key==='C') setModeSafe('connect'); if(e.key==='v'||e.key==='V') setModeSafe('select');
      if(e.key==='r'||e.key==='R') startRecord(); if((e.key==='f'||e.key==='F')&&sceneRef.current) sceneRef.current.view('iso');
      if((e.key==='g'||e.key==='G')){ if(s&&s.kind==='multi'){ const n=S.current.diagram.nodes.filter(x=>x.type==='grp-server').length+1; makeGroup('grp-server','server-'+String(n).padStart(2,'0')); } else say('Shift-click two or more blocks first, then press G.'); }
      if(e.key==='l'||e.key==='L') setLabelMode(m=>m==='basic'?'detail':'basic');
      if(e.key==='?') setHelp(true); };
    window.addEventListener('keydown',kd); return ()=>window.removeEventListener('keydown',kd); },[diagram]);

  const blockCount=diagram.nodes.filter(n=>!isGroupType(n.type)).length;
  const summary=`${blockCount} components · ${diagram.edges.length} connections`;
  const frameAspect=()=>({'16:9':16/9,'4:3':4/3,'1:1':1}[frame]||null);
  async function exportPNG(){
    const sc=sceneRef.current; if(!sc||busy) return; setMenuOpen(false); const prev=sel; sc.setSelection(null); sc.setMarked([]);
    setBusy({label:'Rendering PNG',p:.5}); await new Promise(r=>setTimeout(r,30));
    let out; try{ out=await sc.snapshot(pngW,frameAspect(),fitExport,diagram.title,summary); }catch(err){ out=null; }
    sc.setSelection(prev); setBusy(null);
    if(!out||!out.blob){ say('The PNG couldn\'t be rendered at that size. Try a smaller resolution.'); return; }
    try{ const st=await saveFile(slug(diagram.title)+'-'+out.w+'w.png',out.blob); if(st==='saved') say('PNG saved, '+out.w+' × '+out.h+' px.'); }catch(e){ say(saveError(e)); }
  }
  async function exportGIF(){
    const sc=sceneRef.current; if(!sc||busy) return; setMenuOpen(false);
    let tempLive=false;
    if(!playing&&!live){ const f=diagram.flows[0]; if(f) play(f); else { tempLive=true; sc.live=true; } }
    const prev=sel; sc.setSelection(null); sc.setMarked([]);
    setBusy({label:'Recording',p:0});
    const extraColors=[REQ_COLOR,RES_COLOR,EVT_COLOR,STR_COLOR,...diagram.flows.map(f=>f.color)];
    const cap=await sc.startCapture({seconds:gifSecs,fps:gifFps,width:gifW,aspect:frameAspect(),fit:fitExport,title:diagram.title,sub:summary,extraColors,
      onTick:p=>setBusy(b=>b&&b.label==='Recording'&&Math.abs(b.p-p)>.03?{label:'Recording',p}:b)});
    if(tempLive) sc.live=false; sc.setSelection(prev);
    setBusy({label:'Encoding',p:0});
    let blob; try{ blob=await encodeGIF(cap,p=>setBusy({label:'Encoding',p})); }catch(err){ setBusy(null); say('GIF encoding failed. Try a shorter clip or a smaller size.'); return; }
    setBusy(null);
    try{ const st=await saveFile(slug(diagram.title)+'-'+cap.w+'w.gif',blob); if(st==='saved') say('GIF saved, '+cap.w+' × '+cap.h+' px, '+(blob.size/1048576).toFixed(1)+' MB.'); }catch(e){ say(saveError(e)); }
  }
  async function downloadZip(){
    if(busy) return; setMenuOpen(false); setBusy({label:'Packing project',p:0});
    const enc=new TextEncoder(), files=[];
    for(let k=0;k<PROJECT_FILES.length;k++){ const f=PROJECT_FILES[k]; let data=null;
      const cands=f==='index.html'?['project/index.html','index.source.html','./index.html']:['project/'+f,'./'+f];
      for(const u of cands){ try{ const r=await fetch(u,{cache:'no-store'}); if(r.ok){ const b=new Uint8Array(await r.arrayBuffer()); if(b.length){ data=b; break; } } }catch(e){} }
      if(!data&&f==='index.html') data=enc.encode(selfHTML());
      if(data) files.push({name:'archflow3d/'+f,data});
      setBusy({label:'Packing project',p:(k+1)/(PROJECT_FILES.length+1)}); }
    files.push({name:'archflow3d/designs/'+slug(diagram.title)+'.json',data:enc.encode(JSON.stringify({app:'ArchFlow 3D',version:2,...diagram},null,2))});
    const blob=makeZip(files); setBusy(null);
    const docs=files.length>3?'':' Docs weren\'t reachable from this copy, so only the app and your design are included.';
    try{ const st=await saveFile('archflow3d-project.zip',blob); if(st==='saved') say('Project zip saved ('+files.length+' files).'+docs); }catch(e){ say(saveError(e)); }
  }
  async function exportJSON(){
    setMenuOpen(false);
    const blob=new Blob([JSON.stringify({app:'ArchFlow 3D',version:2,...diagram},null,2)],{type:'application/json'});
    try{ const st=await saveFile(slug(diagram.title)+'.json',blob); if(st==='saved') say('Design saved as JSON.'); }catch(e){ say(saveError(e)); }
  }
  function importJSON(e){
    const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.nodes)||!Array.isArray(d.edges)) throw 0;
        stopFlow(); setSel(null); setDiagram(cleanGroups({title:d.title||'Imported architecture',nodes:d.nodes.filter(n=>BY_TYPE[n.type]),edges:d.edges,flows:Array.isArray(d.flows)?d.flows:[]}));
        setTimeout(()=>sceneRef.current&&sceneRef.current.view('iso'),60); say('Design loaded.'); }
      catch(err){ say('That file isn\'t an ArchFlow design. Choose a .json saved from this app.'); } };
    r.readAsText(f); e.target.value='';
  }

  const nameOf=id=>(diagram.nodes.find(n=>n.id===id)||{}).name||'(removed)';
  const playingFlow=diagram.flows.find(f=>f.id===playing);
  const hops=playingFlow?hopsOf(playingFlow,diagram.edges):[];
  const protoOf=h=>{ const e=diagram.edges.find(e=>e.id===h.edge); return (e&&e.label?e.label:'direct')+(h.kind&&h.kind!=='request'?' · '+CONNECTORS[h.kind].short:''); };
  const totalRps=diagram.flows.reduce((s,f)=>s+(+f.rps||0),0);
  const utilList=diagram.nodes.filter(n=>!isGroupType(n.type)&&capOf(n)).map(n=>({n,u:utilOf(n,loads.node[n.id]||0)}));
  const over=utilList.filter(x=>x.u>=1), hot=utilList.filter(x=>x.u>=.9&&x.u<1);
  const busiest=diagram.nodes.filter(n=>!isGroupType(n.type)).reduce((b,n)=>(loads.node[n.id]||0)>(b?loads.node[b.id]||0:0)?n:b,null);

  let hint=null;
  if(mode==='connect') hint=connectFrom?html`<span>From <em>${nameOf(connectFrom)}</em>: click the target block. New links are <em>${CONNECTORS[connectKind].label.toLowerCase()}</em>. Esc when done.</span>`:html`<span>Click the <em>source</em> block, then the target.</span>`;
  if(mode==='record') hint=html`<span>Recording flow: click blocks in the order a request travels. ${rec&&rec.steps.length?html`<em>${rec.steps.length} steps</em>`:''}</span>`;

  return html`<div className="app">
    <header className="top">
      <div className="brand"><b>Arch<span>Flow</span> 3D</b></div>
      <input className="title-in" id="diagram-title" type="text" aria-label="Diagram title" value=${diagram.title} onInput=${e=>setDiagram(d=>({...d,title:e.target.value}))} />
      <div className="spacer"></div>
      <div className="grp" data-tour="templates">
        <select className="btn" id="template" aria-label="Load template" value="" onChange=${e=>{ if(e.target.value) loadTemplate(e.target.value); }}>
          <option value="">Load template…</option>
          <option value="ecommerce">Checkout microservices</option>
          <option value="monolith">Single-server deployment</option>
          <option value="serverless">Serverless on AWS</option>
          <option value="azure">IoT telemetry on Azure</option>
          <option value="blank">Blank canvas</option>
        </select>
        <button className="btn ghost" onClick=${()=>fileRef.current&&fileRef.current.click()}>Open JSON</button>
        <input ref=${fileRef} className="file-in" id="file-in" type="file" accept=".json,application/json" onChange=${importJSON} />
      </div>
      <div className="grp" data-tour="help">
        <button className="btn ghost" onClick=${()=>setTour(true)}>Tour</button>
        <button className="btn ghost" onClick=${()=>setHelp(true)}>Help</button>
      </div>
      <${ExportMenu} open=${menuOpen} setOpen=${setMenuOpen} busy=${busy} aspect=${aspect} frame=${frame} setFrame=${setFrame} fit=${fitExport} setFit=${setFitExport}
        pngW=${pngW} setPngW=${setPngW} gifW=${gifW} setGifW=${setGifW} gifSecs=${gifSecs} setGifSecs=${setGifSecs} gifFps=${gifFps} setGifFps=${setGifFps}
        onPNG=${exportPNG} onGIF=${exportGIF} onJSON=${exportJSON} onZip=${downloadZip} />
    </header>

    <div className="main">
      <aside className="pane left" data-tour="palette"><${Palette} onAdd=${addNode} /></aside>

      <section className="stage" data-tour="stage">
        <div className="canvas-host" ref=${hostRef}></div>
        <div className="toolbar" data-tour="tools">
          <div className="seg" role="group" aria-label="Tool">
            <button className=${mode==='select'?'on':''} onClick=${()=>setModeSafe('select')} title="Select and move (V). Shift-click to multi-select.">Select</button>
            <button className=${mode==='connect'?'on':''} onClick=${()=>setModeSafe('connect')} title="Connect blocks (C)">Connect</button>
            <button className=${mode==='record'?'on':''} onClick=${startRecord} title="Record a request flow (R)">Record flow</button>
          </div>
          ${mode==='connect'&&html`<div className="seg"><select id="connect-kind" aria-label="Connector type for new links" value=${connectKind} onChange=${e=>setConnectKind(e.target.value)}>
            ${CONNECTOR_KEYS.map(k=>html`<option key=${k} value=${k}>${CONNECTORS[k].label}</option>`)}</select></div>`}
          ${sel&&sel.kind==='multi'&&mode==='select'&&html`<div className="seg"><button className="on" onClick=${()=>{ const n=diagram.nodes.filter(x=>x.type==='grp-server').length+1; makeGroup('grp-server','server-'+String(n).padStart(2,'0')); }} title="Group selected blocks (G)">Group ${sel.ids.length} into server</button></div>`}
          <div className="seg" role="group" aria-label="Camera">
            <button onClick=${()=>sceneRef.current&&sceneRef.current.view('iso')}>Fit</button>
            <button onClick=${()=>sceneRef.current&&sceneRef.current.view('top')}>Top</button>
            <button onClick=${()=>sceneRef.current&&sceneRef.current.view('front')}>Front</button>
          </div>
          <div className="seg" role="group" aria-label="Labels">
            <button className=${labelMode==='basic'?'on':''} onClick=${()=>setLabelMode('basic')} title="Names and load only">Names</button>
            <button className=${labelMode==='detail'?'on':''} onClick=${()=>setLabelMode('detail')} title="Show descriptions on labels (L)">Details</button>
          </div>
        </div>
        <div className="legend" aria-label="Packet colours">
          <span><i style=${{background:'var(--req)'}}></i>request</span><span><i style=${{background:'var(--res)'}}></i>response</span>
          <span><i style=${{background:'var(--evt)'}}></i>event</span><span><i style=${{background:'var(--str)'}}></i>stream</span>
        </div>
        <div className="tip" ref=${tipRef} hidden></div>
        ${!diagram.nodes.length&&html`<div className="empty"><div><b>Empty canvas</b>Add a block from the palette, or load a template.</div></div>`}
        ${hint&&html`<div className="hint">${hint}</div>`}
        ${busy&&busy.label==='Recording'&&frame!=='stage'&&html`<div className="hint">Recording at ${frame}. The preview may look stretched until it finishes.</div>`}
        ${busy&&html`<div className="rec">${busy.label==='Recording'&&html`<span className="dot"></span>`}${busy.label} <div className="bar"><div style=${{width:Math.round(busy.p*100)+'%'}}></div></div>${Math.round(busy.p*100)}%</div>`}
      </section>

      <aside className="pane right">
        <div data-tour="inspector">
        ${mode==='record'&&rec?html`<div className="sec"><h3>Recording flow</h3>
            <div className="field"><label htmlFor="rec-name">Flow name</label><input id="rec-name" type="text" value=${rec.name} onInput=${e=>setRec(r=>({...r,name:e.target.value}))} /></div>
            ${!rec.steps.length&&html`<p className="muted">Click the client block where the request starts, then each block it passes through. Replies travel back automatically, except over one-way and streaming links.</p>`}
            <div className="recsteps">${rec.steps.map((s,i)=>html`<div className="recstep" key=${i}>
              <span className="no">${i+1}</span>
              <div><div className="nn">${nameOf(s.node)}</div>
                ${i>0&&html`<input id=${'rec-note-'+i} type="text" placeholder="Request, e.g. POST /orders" value=${s.note} onInput=${e=>{ const v=e.target.value; setRec(r=>({...r,steps:r.steps.map((x,j)=>j===i?{...x,note:v}:x)})); }} />`}
              </div></div>`)}</div>
            <div className="grp"><button className="btn sm primary" onClick=${saveRecord}>Save flow</button>
              <button className="btn sm" disabled=${!rec.steps.length} onClick=${()=>setRec(r=>({...r,steps:r.steps.slice(0,-1)}))}>Undo step</button>
              <button className="btn sm ghost" onClick=${()=>setModeSafe('select')}>Cancel</button></div></div>`
          : html`<${Inspector} diagram=${diagram} sel=${sel} loads=${loads} update=${update} remove=${remove} startConnect=${startConnect} makeGroup=${makeGroup} ungroup=${ungroup} setSel=${setSel} />`}
        </div>

        <div className="sec" data-tour="flows"><h3>Flows and traffic <button className="btn sm" onClick=${startRecord}>+ Record</button></h3>
          ${diagram.flows.length?html`<div className="traffic">
            <div><b>${fmtRps(totalRps)}</b><span>req/s in total</span></div>
            <div><b style=${{color:over.length?'var(--danger)':hot.length?'#ffcc4d':'#4fd1a5'}}>${over.length?over.length+' over':hot.length?hot.length+' near':'All OK'}</b><span>${over.length||hot.length?'capacity':'capacity'}</span></div>
            <div><b>${busiest&&loads.node[busiest.id]?fmtRps(loads.node[busiest.id]):'–'}</b><span title=${busiest?busiest.name:''}>busiest: ${busiest&&loads.node[busiest.id]?busiest.name:'none'}</span></div>
          </div>`:null}
          ${!diagram.flows.length&&html`<p className="muted">No flows yet. Record one to simulate how a request moves through your system.</p>`}
          ${diagram.flows.map(f=>html`<div key=${f.id} className=${'flow'+(playing===f.id?' playing':'')} style=${{'--fc':f.color}}>
            <div className="hd"><span className="sw" title="Path highlight colour"></span>
              <input id=${'flow-name-'+f.id} type="text" aria-label="Flow name" value=${f.name} onInput=${e=>setFlow(f.id,{name:e.target.value})} />
              ${playing===f.id?html`<button className="btn sm on" onClick=${stopFlow}>Stop</button>`:html`<button className="btn sm" onClick=${()=>play(f)}>Play</button>`}
              <button className="btn sm ghost danger" aria-label="Delete flow" onClick=${()=>{ if(playing===f.id) stopFlow(); setDiagram(d=>({...d,flows:d.flows.filter(x=>x.id!==f.id)})); }}>✕</button>
            </div>
            <div className="rps"><label htmlFor=${'flow-rps-'+f.id}>Rate</label>
              <input id=${'flow-rps-'+f.id} type="number" min="0" step="any" value=${f.rps==null?'':f.rps} placeholder="0" onInput=${e=>setFlow(f.id,{rps:e.target.value===''?undefined:Math.max(0,+e.target.value)})} />
              <span>req/s</span></div>
            <div className="path">${f.steps.map(s=>nameOf(s.node)).join(' → ')}</div>
          </div>`)}
          <div className="ctl">
            <label htmlFor="speed">Speed <input id="speed" type="range" min="0.25" max="3" step="0.25" value=${speed} onInput=${e=>setSpeed(+e.target.value)} /> <span className="chip">${speed}×</span></label>
          </div>
          <div className="ctl">
            <label><input id="loop" type="checkbox" checked=${loop} onChange=${e=>setLoop(e.target.checked)} /> Loop flow</label>
            <label title="Every flow sends requests continuously, more often for higher rates"><input id="live" type="checkbox" checked=${live} onChange=${e=>setLive(e.target.checked)} /> Live traffic (all flows at their rates)</label>
          </div>
        </div>

        <div className="sec" data-tour="log"><h3>Hop log ${playingFlow&&html`<span className="chip">${playingFlow.name}${playingFlow.rps?' · '+fmtRps(playingFlow.rps)+'/s':''}</span>`}</h3>
          ${!playingFlow?html`<p className="muted">Play a flow to trace each hop with its connector, protocol and payload.</p>`:
          html`<div className="log">${hops.map((h,i)=>html`<div key=${i} className=${'hop '+h.dir+(i===hop?' on':'')+(hop>i?' done':'')} title=${HOP_WORD[h.dir]}>
            <span className="no">${i+1}</span><span className="ar">${HOP_ARROW[h.dir]}</span>
            <span className="tx">${nameOf(h.from)} to ${nameOf(h.to)}<small>${protoOf(h)}${h.note?' · '+h.note:''}</small></span>
          </div>`)}</div>`}
        </div>
      </aside>
    </div>
    ${toast&&html`<div className="toast" role="status">${toast}</div>`}
    ${tour&&html`<${Tour} onClose=${closeTour} />`}
    ${help&&html`<${HelpModal} onClose=${()=>setHelp(false)} onTour=${()=>setTour(true)} />`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body>
</html>
